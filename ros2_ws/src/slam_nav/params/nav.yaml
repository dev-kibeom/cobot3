# Nav2 파라미터 템플릿 — iw_hub_ROS_01/02 공용 (slam_nav 패키지)
#
# `<ROBOT>` placeholder는 launch에서 robot bare name (iw_hub_ROS_01 또는 02)로
# 일괄 치환됨. 두 robot이 동일한 Nav2 튜닝을 공유 — 2026-05-26 회전속도/yaw
# tolerance 튜닝을 robot1/2 둘 다 적용.
#
# 핵심 결정 사항 요약:
#   - RotationShimController로 DWB wrap (angular_dist_threshold 0.349rad = 20°) → spin 적극
#   - DWB sampling: vx_samples 10, vtheta_samples 30 (회전 우세)
#   - PathAlign.scale 64 (path 정렬 강조)
#   - inflation_radius 0.75, footprint_padding 0.25
#   - observation_persistence 0.5초 (LiDAR drift 잔상 단축)
#   - goal_checker_plugins (복수형!) — 키 mismatch 회피
#   - global_frame = world (basic2.yaml의 origin frame)
#   - 2026-05-26 회전속도 1.3배 (max_velocity angular 3.3, rotate_to_heading 1.95,
#                                max_vel_theta 3.3, acc_lim_theta 7.9)
#   - 2026-05-26 yaw_goal_tolerance 0.5 (29°) — dolly 적재 시 stuck 해결
#   - amcl 섹션은 보류 (Phase 2에서 활성화 검토)

amcl:
  ros__parameters:
    use_sim_time: True
    # 현재는 placeholder — launch에서 amcl 노드 띄우지 않음.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "world"
    odom_frame_id: "<ROBOT>/odom"
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    scan_topic: /<ROBOT>/front_2d_lidar/scan
    map_topic: /<ROBOT>/warehouse_map
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    transform_tolerance: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: world
    robot_base_frame: base_link
    odom_topic: /<ROBOT>/chassis/odom
    bt_loop_duration: 20
    default_server_timeout: 40
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 2026-05-26: angular 3.3 (1.3배). robot2도 robot1과 동일하게 통일 (2026-05-27).
    max_velocity: [2.5, 0.0, 3.3]
    min_velocity: [-2.5, 0.0, -3.3]
    velocity_timeout: 1.0
    odom_topic: "/<ROBOT>/chassis/odom"
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 15.0

    stopped_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      # 2026-05-26: yaw_tolerance 0.3 → 0.5 — dolly 적재 시 stuck 해결.
      yaw_goal_tolerance: 0.5
      stateful: True

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.349        # 20° — 이상 차이면 spin
      forward_sampling_distance: 0.5
      # 2026-05-26: 1.95 (1.3배)
      rotate_to_heading_angular_vel: 1.95
      max_angular_accel: 4.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      # --- DWB params ---
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 3.0
      max_vel_y: 0.0
      # 2026-05-26: 3.3 (1.3배)
      max_vel_theta: 3.3
      min_speed_xy: 0.0
      max_speed_xy: 2.5
      min_speed_theta: 0.0
      acc_lim_x: 5.0
      acc_lim_y: 0.0
      acc_lim_theta: 7.9
      decel_lim_x: -5.0
      decel_lim_y: 0.0
      decel_lim_theta: -7.9
      vx_samples: 10
      vy_samples: 5
      vtheta_samples: 30
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 64.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      footprint_padding: 0.25
      global_frame: <ROBOT>/odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: True
      width: 7
      height: 7
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      plugins: ["front_rplidar_obstacle_layer", "back_rplidar_obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 0.3
        inflation_radius: 0.75
      front_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /<ROBOT>/front_2d_lidar/scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          observation_persistence: 0.5
      back_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /<ROBOT>/back_2d_lidar/scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          observation_persistence: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.25
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: world
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan back_scan
        scan:
          topic: /<ROBOT>/front_2d_lidar/scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
          observation_persistence: 0.5
        back_scan:
          topic: /<ROBOT>/back_2d_lidar/scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
          observation_persistence: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # basic2 절대맵 — slam_nav/maps/basic2.{png,yaml} → map_server가 이 토픽으로 publish.
        map_topic: /<ROBOT>/warehouse_map
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.3
        inflation_radius: 0.75
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: <ROBOT>/odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.5
    min_rotational_vel: 0.6
    rotational_acc_lim: 6.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
